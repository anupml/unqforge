name: tests

on: [push, pull_request]

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Round-trip every shortcut in the corpus
        run: python3 tools/roundtrip.py shortcuts/*
      - name: Coverage
        run: python3 tools/coverage.py || true
